version: "3.8"
services:
  sql-server:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sql_universe_gym
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Password123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s

  sql-setup:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sql_universe_setup
    depends_on:
      sql-server:
        condition: service_healthy
    volumes:
      - ./Setup:/setup
    command: >
      /bin/bash -c "
      echo 'Waiting for SQL Server to be ready...' &&
      /opt/mssql-tools/bin/sqlcmd -S sql-server -U sa -P 'YourStrong!Password123' -d master -i /setup/01_schema.sql -i /setup/02_data.sql &&
      echo 'Gym Setup Completed! The Universe is ready for your experiments.'
      "

volumes:
  sql_data:
